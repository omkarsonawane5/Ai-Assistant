[project]
name = "ai-assistant-api"
version = "0.1.0"
description = "Phase 1 FastAPI backend for a text-first AI assistant foundation."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.3",
  "asyncpg>=0.30.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "email-validator>=2.2.0",
  "openai>=1.54.0",
  "passlib[argon2]>=1.7.4",
  "pydantic-settings>=2.6.1",
  "pydantic>=2.9.2",
  "pyjwt>=2.9.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy[asyncio]>=2.0.35",
  "uvicorn[standard]>=0.32.0"
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20.0",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
